<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Studio - Web Layout Editor</title>
    <link rel="stylesheet" href="style.css">
    <!-- Иконки FontAwesome для стиля IDE -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233DDC84'><path d='M6 18c0 .55.45 1 1 1h1v3c0 .55.45 1 1 1s1-.45 1-1v-3h4v3c0 .55.45 1 1 1s1-.45 1-1v-3h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zM15.53 2.16l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 1.23 12.95 1 12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.73 3.36 5.5 5.53 5.5 8h13c0-2.47-1.23-4.64-2.97-5.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z'/></svg>">
</head>
<body>

    <!-- Верхняя панель (Header / Toolbar Studio) -->
    <header class="studio-header">
        <div class="logo">
            <i class="fa-brands fa-android brand-icon"></i>
            <span>Android Studio Layout Editor</span>
        </div>
        <div class="toolbar-actions">
            <button class="btn-tool" id="btnFormat" title="Форматировать XML"><i class="fa-solid fa-code"></i> Format</button>
            <button class="btn-tool run" id="btnRun" title="Обновить Превью"><i class="fa-solid fa-play"></i> Render</button>
        </div>
    </header>

    <!-- Главная рабочая область -->
    <main class="studio-workspace">
        
        <!-- Панель Редактора XML -->
        <section class="pane editor-pane">
            <div class="pane-header">
                <div class="tab active">
                    <i class="fa-solid fa-file-code"></i> activity_main.xml
                </div>
            </div>
            <div class="editor-body">
                <textarea id="xmlInput" spellcheck="false" placeholder="<!-- Вставьте ваш Android Layout XML -->"></textarea>
            </div>
            <div id="errorMessage" class="error-log"></div>
        </section>

        <!-- Разделитель панелей -->
        <div class="resizer"></div>

        <!-- Панель Превью (Device Frame) -->
        <section class="pane preview-pane">
            <div class="pane-header">
                <span><i class="fa-solid fa-mobile-screen-button"></i> Device Preview</span>
                <span class="device-spec">Pixel 6 — 393 x 851 dp (420dpi)</span>
            </div>
            
            <div class="viewport">
                <!-- Оболочка Смартфона -->
                <div class="phone-frame">
                    <div class="status-bar">
                        <span>12:00</span>
                        <div class="status-icons">
                            <i class="fa-solid fa-wifi"></i>
                            <i class="fa-solid fa-battery-full"></i>
                        </div>
                    </div>
                    
                    <!-- Экран, куда рендерится layout -->
                    <div id="preview" class="android-screen"></div>

                    <div class="navigation-bar">
                        <div class="nav-btn"></div>
                        <div class="nav-btn circle"></div>
                        <div class="nav-btn square"></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Нижний статус-бар Studio -->
    <footer class="studio-footer">
        <span id="statusText"><i class="fa-solid fa-check-double"></i> Gradle build finished successfully</span>
        <span>UTF-8 &nbsp;&nbsp; XML</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
